name: warmer

# Keeps the V4 (and V2) sampled-TWAP oracle rings fresh. A V4 ring is only as fresh as the last
# on-chain snapshot tx, and V4Source.getPrice reverts Stale once the newest sample exceeds
# MAX_SNAPSHOT_AGE (deployed at ~20 min). There is NO always-on host (migrated off Fly) and GitHub's
# */5 cron is best-effort and jitters minutes late, so ONE snapshot per tick would flap the market
# offline. Instead each run snapshots repeatedly across most of the 5-min window (`warmer --once` ->
# cronWarm: every WARMER_CRON_INTERVAL_MS for WARMER_CRON_DURATION_MS), so coverage overlaps across
# ticks and the newest sample stays well inside MAX_SNAPSHOT_AGE even if a tick is skipped or late.
#
# ⚠️ CUTOVER: core addresses come from repo VARIABLES (shared with indexer.yml/keeper.yml), with the
# current LIVE v2 addresses as `||` fallbacks, so nothing changes pre-cutover. V4_MARKETS defaults to
# EMPTY, so this workflow is an inert no-op until cutover. At cutover set the repo variables
# (ORACLE_ADDRESS/ENGINE_ADDRESS/… + DEPLOY_BLOCK) to the FINAL re-deployed V4 stack and set
# V4_MARKETS to the V4-routed token ids (e.g. ROBINHOOD 0x008Df4b3E857D06c4603Aeb11F267ccD32ce2005).

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: warmer
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # --- secrets (set in repo Settings → Secrets and variables → Actions) ---
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RPC_URL_PRIMARY: ${{ secrets.RPC_URL_PRIMARY }}
      WARMER_PRIVATE_KEY: ${{ secrets.WARMER_PRIVATE_KEY }}
      # --- public config (Robinhood Chain mainnet 4663) — from repo variables, v2 fallbacks ---
      CHAIN_ID: "4663"
      RPC_URL_SECONDARY: "https://rpc.mainnet.chain.robinhood.com"
      ORACLE_ADDRESS: "${{ vars.ORACLE_ADDRESS || '0xB8638fd2d0B99d5369403fA7d7C78F5821461721' }}"
      ENGINE_ADDRESS: "${{ vars.ENGINE_ADDRESS || '0xD7b150C2173Db592b3F8FDA65BeE8F99245D468d' }}"
      VAULT_ADDRESS: "${{ vars.VAULT_ADDRESS || '0x3BCfe3bD9a8D3F234D59638837a8fe7a338Bb439' }}"
      SESSION_MANAGER_ADDRESS: "${{ vars.SESSION_MANAGER_ADDRESS || '0x7D013b7660b3fE08EE43E12FB433F83AD6c00593' }}"
      FEE_DISTRIBUTOR_ADDRESS: "${{ vars.FEE_DISTRIBUTOR_ADDRESS || '0xaC271CD320f94f6D6b0CBC3340F0bd5b533EeD85' }}"
      WBNB_ADDRESS: "0x0Bd7D308f8E1639FAb988df18A8011f41EAcAD73"
      # V4-routed market token ids to keep warm (CSV). EMPTY until cutover => warmer is an inert no-op.
      V4_MARKETS: "${{ vars.V4_MARKETS || '' }}"
      WARMER_CRON_DURATION_MS: "270000"
      WARMER_CRON_INTERVAL_MS: "75000"
      LOG_LEVEL: "info"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsx src/services/warmer.ts --once
